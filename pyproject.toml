[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tiling-mask"
version = "0.1.0"
description = "Fast conversion of GeoJSON annotations into pixel- and tile-resolution TIFF masks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tiling Mask contributors" }]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10",
  "rasterio>=1.3.10",
]

[project.optional-dependencies]
test = ["pytest>=8", "tifffile>=2024.2.12"]

[project.scripts]
tiling-mask = "tiling_mask.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tiling_mask"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
